# ublox_gps / ublox_gps_node (KumarRobotics ublox, ros2 branch), used for all
# five u-blox modules in rig.yaml (M8, M10s, F10).
#
# The driver does NOT configure the modules (config_on_startup: false): it only
# opens the port at uart1.baudrate and publishes what arrives. tools/gps_setup.py
# sets each module up once per session (115200 baud, UBX + NMEA, 5 Hz, sea model,
# NAV-PVT, NAV-SAT 1 Hz, NMEA GGA/RMC/GST; constellations left at factory). This
# works the same on every module, including the M10/F10 that NAK the driver's
# CFG-GNSS writes. The gnss.*, sbas.*, dynamic_model, rate and save/load settings
# below are therefore not sent; they are kept for reference.
# Every parameter the node declares is listed. Values not set for this
# project are the driver defaults. Source:
# https://github.com/KumarRobotics/ublox/blob/ros2/ublox_gps/src/node.cpp (getRosParams)
# Keep each value's type (int vs float) as written, or the node fails to start.
# Parameters declared without a default are commented out: setting them
# switches a feature on (USB port config, RTCM output, datum, base-station modes).
/**:   # one node per u-blox module in rig.yaml (namespace gps/<id>)
  ros__parameters:
    debug: 0                  # default 1 (logs every UBX message at DEBUG)

    # Serial port. With config_on_startup false the driver only sets the Pi side
    # to uart1.baudrate (115200 after gps_setup.py).
    device: /dev/ttyAMA0   # overridden per module from rig.yaml
    frame_id: gps   # overridden per module from rig.yaml
    uart1:
      baudrate: 115200   # overridden per module from rig.yaml
      in: 7                   # UBX(1) | NMEA(2) | RTCM(4)
      out: 3                  # UBX(1) | NMEA(2); only sent when config_on_startup is true
    usb:
      # in:                   # no default; setting in/out configures the module's USB port
      # out:
      tx_ready: 0

    # Rates. Measurement rate in Hz; nav_rate = measurement cycles per solution.
    # Only used for the driver's frequency diagnostics when not configuring.
    rate: 5.0                 # default 4.0
    nav_rate: 1

    # Receiver configuration on startup: off, done by tools/gps_setup.py instead.
    config_on_startup: false  # default true
    clear_bbr: false
    save_on_shutdown: false
    load:
      mask: 0
      device: 0
    save:
      mask: 0
      device: 0

    gnss:                     # SAM-M8Q: up to 3 major constellations at once
      gps: true
      glonass: true           # default false
      galileo: true           # default false
      beidou: false
      qzss: false
      sbas: true              # default false (WAAS)
      imes: false
    sbas:
      max: 0
      usage: 0
    dynamic_model: sea        # default portable
    fix_mode: auto
    dr_limit: 0
    enable_ppp: false
    use_adr: true             # only used by ADR/UDR products (M8U/M8L)

    # RTCM output / base station (HPG products, not the SAM-M8Q)
    # rtcm:
    #   ids: []               # no default
    #   rates: []
    # dgnss_mode:             # no default
    # tmode3:                 # no default
    sv_in:
      reset: true
      min_dur: 0
      acc_lim: 0.0
    arp:
      # position: []          # no default
      # position_hp: []
      acc: 0.0
      lla_flag: false

    # Map datum (default WGS84)
    dat:
      set: false
      # majA:                 # no default; all five needed when dat.set is true
      # flat:
      # shift: []
      # rot: []
      # scale:

    raw_data: false
    raw_data_stream:
      enable: false

    # NMEA output settings (CFG-NMEA, only applied when nmea.set is true)
    nmea:
      set: false
      compat: false
      consider: false
      limit82: false
      high_prec: false
      filter:
        pos: false
        msk_pos: false
        time: false
        date: false
        sbas: false
        track: false
        gps_only: false
      gnssToFilter:
        gps: false
        sbas: false
        qzss: false
        glonass: false
        beidou: false

    # Publishers. ~/fix and ~/fix_velocity are always published.
    # nav.pvt -> /gps/ublox_gps_node/navpvt: every PVT field (fix type, numSV,
    #   hAcc/vAcc/sAcc, pDOP, flags, UTC time) for module comparison.
    # nav.sat -> /gps/navstate: per-satellite C/N0, elevation, used flag (every 20 solutions).
    publish:
      all: false
      nav:
        all: false
        att: false
        clock: false
        cov: false
        heading: false
        posecef: false
        posllh: false
        pvt: true
        relposned: false
        sat: true
        sol: false
        svin: false
        svinfo: false
        status: false
        timegps: false
        timeutc: false
        velned: false
      rxm:
        all: false
        almRaw: false
        eph: false
        rtcm: false
        raw: false
        sfrb: false
      aid:
        all: false
        alm: false
        eph: false
        hui: false
      mon:
        all: false
        hw: false
      tim:
        tm2: false
      nmea: true              # -> /gps/<id>/ublox_gps_node/nmea (nmea_msgs/Sentence, Pi-clock stamp): GGA, RMC, GST
      esf:                    # ESF/HNR only exist on ADR/UDR products
        all: false            # default true
        ins: false
        meas: false
        raw: false
        status: false
      hnr:
        pvt: false            # default true

    inf:
      all: true
      debug: false
      error: true
      notice: true
      test: true
      warning: true

    diagnostic_period: 0.2
