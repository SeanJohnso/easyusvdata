# nmea_navsat_driver / nmea_serial_driver, for GPS modules in rig.yaml with
# `driver: nmea` (2026-11-22: the M10-25Q, whose UART input disables itself at
# power-up, so it can't be switched to UBX and runs in its factory NMEA state).
# Every parameter the node declares is listed. Values not set for this
# project are the driver defaults. Source:
# https://github.com/ros-drivers/nmea_navsat_driver/blob/ros2/src/libnmea_navsat_driver/driver.py
# Keep each value's type (int vs float) as written, or the node fails to start.
# Topics (namespace gps/<id>): fix, vel (TwistStamped), time_reference, heading.
/**:   # node gps/<id>/nmea_navsat_driver, started by rig.launch.py
  ros__parameters:
    # Serial port (nmea_serial_driver.py)
    port: /dev/ttyUSB0   # overridden per module from rig.yaml
    baud: 4800           # overridden per module from rig.yaml

    # Frames
    frame_id: gps        # overridden per module from rig.yaml
    tf_prefix: ""             # prepended to frame_id

    # Time
    time_ref_source: gps      # written into time_reference source field
    use_GNSS_time: false      # true: header.stamp from the GPS clock, not the Pi's
    useRMC: false             # true: fix and velocity from RMC (no HDOP/covariance), not GGA/VTG

    # Position sigma (m) per fix type = HDOP * epe_qualityN, driver defaults
    # ("as shipped"). N is the GGA fix quality: 1 GPS, 2 DGPS/SBAS, 4 RTK fixed,
    # 5 RTK float, 9 WAAS; 0 = no fix. GST sigmas replace these when sent.
    epe_quality0: 1000000     # integer in the driver
    epe_quality1: 4.0
    epe_quality2: 0.1
    epe_quality4: 0.02
    epe_quality5: 4.0
    epe_quality9: 3.0
